<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Frame2Reel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎞️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #160a2b 0%, #2a1050 50%, #5a1d6e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(22, 10, 43, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo .two { color: #ffc48a; }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffc48a;
        }

        /* Main Content */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 2rem;
        }

        .gallery-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #ffc48a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gallery-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .reel-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .reel-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(255, 95, 162, 0.3);
            border-color: rgba(255, 196, 138, 0.4);
        }

        .reel-card video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .reel-card:hover .reel-overlay {
            opacity: 1;
        }

        .reel-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reel-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .reel-actions {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: rgba(255, 196, 138, 0.3);
            border-color: #ffc48a;
            transform: scale(1.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .empty-description {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }

        .create-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(120deg, #ff5fa2 0%, #ff9a3c 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 95, 162, 0.3);
        }

        .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 95, 162, 0.5);
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(255, 196, 138, 0.2);
            border-color: #ffc48a;
            color: #ffc48a;
        }

        /* Footer */
        footer {
            background: rgba(22, 10, 43, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 5%;
            margin-top: 6rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .copyright {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #ffc48a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-title {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .navbar {
                padding: 1rem 4%;
            }

            .reel-card video {
                height: 300px;
            }
        }

        /* Animated Background Elements */
        .bg-decoration {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .decoration-1 {
            background: #ff5fa2;
            top: -150px;
            right: -150px;
        }

        .decoration-2 {
            background: #8b2fc9;
            bottom: -150px;
            left: -150px;
        }

        /* Loading Animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .loading-card {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
            height: 400px;
            border-radius: 28px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .gallery-grid video {
            width: 100%;
            height: 500px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .gallery-grid video:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(255, 95, 162, 0.3);
            border-color: rgba(255, 196, 138, 0.4);
        }
    </style>
</head>
<body>
    <!-- Background Decorations -->
    <div class="bg-decoration decoration-1"></div>
    <div class="bg-decoration decoration-2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="logo">Frame<span class="two">2</span>Reel</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/create">Create Reel</a>
            <a href="/gallery" class="active">Gallery</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="gallery-container">
        <h1 class="gallery-title">Reel Gallery</h1>
        <p class="gallery-subtitle">Explore amazing reels created with AI</p>

        <div class="gallery-grid">
        {% for reel in reels %}
            <video src="/static/reels/{{reel}}" controls></video>
        {% endfor %}
 
        </div>

        <!-- Empty State (Hidden by default, shown when no reels) -->
        <div class="empty-state" style="display: none;">
            <div class="empty-icon">🎬</div>
            <h2 class="empty-title">No Reels Yet</h2>
            <p class="empty-description">Start creating amazing reels with AI</p>
            <a href="/create" class="create-btn">
                ✨ Create Your First Reel
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="copyright">
                © 2026 Frame2Reel. All rights reserved.
            </div>
            <div class="social-links">
                <a href="#" title="Instagram">

                <a href="#" title="Twitter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script>

        // Pause other videos when one plays
        const videos = document.querySelectorAll('video');
        videos.forEach(video => {
            video.addEventListener('play', () => {
                videos.forEach(v => {
                    if (v !== video) v.pause();
                });
            });
        });

        // Show empty state if no videos (for Flask template integration)
        // Uncomment this if you want to show empty state when gallery is empty

        const galleryGrid = document.getElementById('galleryGrid');
        const emptyState = document.querySelector('.empty-state');
        if (galleryGrid.children.length === 0) {
            galleryGrid.style.display = 'none';
            emptyState.style.display = 'block';
        }
        */
    </script>
</body>
</html>
