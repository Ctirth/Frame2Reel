<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Reel - Frame2Reel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎞️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #160a2b 0%, #2a1050 50%, #5a1d6e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(22, 10, 43, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo .two { color: #ffc48a; }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffc48a;
        }

        /* Main Content */
        .upload-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1rem;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .upload-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #ffc48a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-instructions {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            font-size: 1.05rem;
        }

        /* File Upload Area */
        .dropzone {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 196, 138, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .dropzone:hover {
            border-color: rgba(255, 196, 138, 0.6);
            background: rgba(255, 255, 255, 0.05);
        }

        #fileInputs {
            margin-bottom: 1.5rem;
        }

        .file-input-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .file-input-group:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 196, 138, 0.4);
        }

        .file-input {
            flex: 1;
            padding: 0.75rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .file-input::file-selector-button {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(120deg, #ff5fa2 0%, #ff9a3c 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-input::file-selector-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 95, 162, 0.4);
        }

        .remove-file-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 8px;
            color: #ff3b30;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            line-height: 1;
        }

        .remove-file-btn:hover {
            background: rgba(255, 59, 48, 0.3);
            transform: scale(1.1);
        }

        .remove-file-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .remove-file-btn:disabled:hover {
            transform: none;
        }

        .add-file-btn {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 196, 138, 0.1);
            border: 2px dashed rgba(255, 196, 138, 0.4);
            border-radius: 12px;
            color: #ffc48a;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-file-btn:hover {
            background: rgba(255, 196, 138, 0.2);
            border-color: #ffc48a;
            transform: translateY(-2px);
        }

        /* Text Input */
        .text-input-container {
            margin: 2rem 0;
        }

        .text-input {
            width: 100%;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s;
        }

        .text-input:focus {
            outline: none;
            border-color: rgba(255, 196, 138, 0.6);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 196, 138, 0.1);
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(120deg, #ff5fa2 0%, #ff9a3c 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 95, 162, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 95, 162, 0.5);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        /* Footer */
        footer {
            background: rgba(22, 10, 43, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 5%;
            margin-top: 4rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .copyright {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #ffc48a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .upload-container {
                padding: 2rem 1.5rem;
            }

            .upload-title {
                font-size: 2rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .navbar {
                padding: 1rem 4%;
            }

            .dropzone {
                padding: 1.5rem;
            }
        }

        /* Animated Background Elements */
        .bg-decoration {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .decoration-1 {
            background: #ff5fa2;
            top: -150px;
            right: -150px;
        }

        .decoration-2 {
            background: #8b2fc9;
            bottom: -150px;
            left: -150px;
        }
    </style>
</head>
<body>
    <!-- Background Decorations -->
    <div class="bg-decoration decoration-1"></div>
    <div class="bg-decoration decoration-2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="logo">Frame<span class="two">2</span>Reel</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/create" class="active">Create Reel</a>
            <a href="/gallery">Gallery</a>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="upload-section">
        <div class="upload-container">
            <h1 class="upload-title">Create Your Reel</h1>
            <p class="upload-instructions">Upload your video files to create an amazing reel. You can upload multiple files.</p>
            
            <form action="/create" enctype="multipart/form-data" method="post" class="dropzone" id="myDropzone">
                <div class="fallback">
                    <div id="fileInputs">
                        <div class="file-input-group">
                            <input name="file1" type="file" class="file-input" />
                            <input name="uuid" type="hidden" value="unique-id-123"/>
                            <button type="button" class="remove-file-btn" onclick="removeFileInput(this)" disabled>×</button>
                        </div>
                    </div>
                    <button type="button" class="add-file-btn" onclick="addFileInput()">+ Add Another File</button>
                </div>
                
                <div class="text-input-container">
                    <textarea class="text-input" id="textInput" name="text" placeholder="Enter your text to be added as voiceover..." rows="5"></textarea>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    🎬 Create Reel
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="copyright">
                © 2026 Frame2Reel. All rights reserved.
            </div>
            <div class="social-links">
                <a href="#" title="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </a>
                <a href="#" title="Twitter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <a href="#" title="Facebook">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script>
        let fileCounter = 2; // Start from 2 since we already have file1

        function addFileInput() {
            const fileInputs = document.getElementById('fileInputs');
            const newFileInput = document.createElement('div');
            newFileInput.className = 'file-input-group';
            newFileInput.innerHTML = `
                <input name="file${fileCounter}" type="file" class="file-input"" />
                <button type="button" class="remove-file-btn" onclick="removeFileInput(this)">×</button>
            `;
            fileInputs.appendChild(newFileInput);
            fileCounter++;
        }

        function removeFileInput(button) {
            const fileInputGroup = button.parentElement;
            fileInputGroup.remove();
        }

        // Add drag and drop visual feedback
        const dropzone = document.getElementById('myDropzone');
        
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.style.borderColor = 'rgba(255, 196, 138, 0.8)';
            dropzone.style.background = 'rgba(255, 196, 138, 0.1)';
        });
        
        dropzone.addEventListener('dragleave', () => {
            dropzone.style.borderColor = 'rgba(255, 196, 138, 0.3)';
            dropzone.style.background = 'rgba(255, 255, 255, 0.03)';
        });
        
        dropzone.addEventListener('drop', () => {
            dropzone.style.borderColor = 'rgba(255, 196, 138, 0.3)';
            dropzone.style.background = 'rgba(255, 255, 255, 0.03)';
        });
    </script>
</body>
</html>
